mcs.metadata:
  componentName: Fabric Naming Conventions & Enforcer
kind: AdaptiveDialog
beginDialog:
  kind: OnRecognizedIntent
  id: main
  intent:
    triggerQueries:
      - fabric naming conventions
      - how should I name fabrics
      - fabric name rules
      - enforce fabric naming standards
      - check fabric name compliance
      - what are the fabric naming guidelines
      - validate my fabric name
      - fabric naming enforcer tool
      - help with fabric names

  actions:
    - kind: Question
      id: question_EObF6s
      interruptionPolicy:
        allowInterruption: true

      variable: Topic.ObjectName
      prompt: `Please provide the Fabric object name you want me to validate.`
      entity:
        kind: StringPrebuiltEntity
        sensitivityLevel: None

    - kind: Question
      id: question_2NFqCP
      interruptionPolicy:
        allowInterruption: true

      variable: init:Topic.ObjectType
      prompt: |-
        What type of Fabric object is this?

        1. Workspace
        2. Lakehouse
        3. Warehouse
        4. Semantic Model
        5. Notebook
        6. Pipeline
        7. Dataflow
        8. Environment
      entity: StringPrebuiltEntity

    - kind: SearchAndSummarizeContent
      id: zGvqkh
      userInput: "You are a Fabric Governance Naming Convention Validator.  Use only the uploaded Naming Convention knowledge source.  Object Name: {ObjectName}  Object Type: {ObjectType}  Tasks: 1. Determine whether the name follows the naming standards. 2. Explain which rule was matched. 3. Explain which rule was violated if applicable. 4. Provide a compliance score from 0-100. 5. Suggest a corrected name if invalid.  Return the response in this format:  Validation Result: Valid / Invalid  Compliance Score: XX%  Rule Evaluation: - Rule 1 - Rule 2 - Rule 3  Suggested Name: <suggested name>  Explanation: <details>"
      additionalInstructions:
      fileSearchDataSource:
        searchFilesMode:
          kind: SearchSpecificFiles
          files:
            - cr681_EnterpriseDataEngineeringAgent.file.DataEngineeringKnowledge-NamingConventions.docx_BMQ

      knowledgeSources:
        kind: SearchSpecificKnowledgeSources

inputType: {}
outputType: {}